services:
  gr-node1:
    image: mysql:8.4
    tmpfs:
      - /var/lib/mysql
    container_name: gr-node1
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - --innodb-buffer-pool-size=128M
      - --server-id=1
      - --log-bin=binlog
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --plugin-load-add=group_replication.so
      - --loose-group-replication-group-name=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      - --loose-group-replication-local-address=172.28.1.2:33061
      - --loose-group-replication-group-seeds=172.28.1.2:33061,172.28.1.3:33061,172.28.1.4:33061
      - --loose-group-replication-start-on-boot=OFF
      - --report-host=172.28.1.2
      - --report-port=3306
      - --disabled-storage-engines=MyISAM,BLACKHOLE,FEDERATED,ARCHIVE,MEMORY
    ports:
      - "3321:3306"
    networks:
      gr:
        ipv4_address: 172.28.1.2
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -proot -e 'SELECT 1' 2>/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  gr-node2:
    image: mysql:8.4
    tmpfs:
      - /var/lib/mysql
    container_name: gr-node2
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - --innodb-buffer-pool-size=128M
      - --server-id=2
      - --log-bin=binlog
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --plugin-load-add=group_replication.so
      - --loose-group-replication-group-name=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      - --loose-group-replication-local-address=172.28.1.3:33061
      - --loose-group-replication-group-seeds=172.28.1.2:33061,172.28.1.3:33061,172.28.1.4:33061
      - --loose-group-replication-start-on-boot=OFF
      - --report-host=172.28.1.3
      - --report-port=3306
      - --disabled-storage-engines=MyISAM,BLACKHOLE,FEDERATED,ARCHIVE,MEMORY
    ports:
      - "3322:3306"
    networks:
      gr:
        ipv4_address: 172.28.1.3
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -proot -e 'SELECT 1' 2>/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  gr-node3:
    image: mysql:8.4
    tmpfs:
      - /var/lib/mysql
    container_name: gr-node3
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - --innodb-buffer-pool-size=128M
      - --server-id=3
      - --log-bin=binlog
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --plugin-load-add=group_replication.so
      - --loose-group-replication-group-name=aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
      - --loose-group-replication-local-address=172.28.1.4:33061
      - --loose-group-replication-group-seeds=172.28.1.2:33061,172.28.1.3:33061,172.28.1.4:33061
      - --loose-group-replication-start-on-boot=OFF
      - --report-host=172.28.1.4
      - --report-port=3306
      - --disabled-storage-engines=MyISAM,BLACKHOLE,FEDERATED,ARCHIVE,MEMORY
    ports:
      - "3323:3306"
    networks:
      gr:
        ipv4_address: 172.28.1.4
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -proot -e 'SELECT 1' 2>/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  bootstrap:
    image: mysql:8.4
    container_name: gr-bootstrap
    depends_on:
      gr-node1:
        condition: service_healthy
      gr-node2:
        condition: service_healthy
      gr-node3:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/bootstrap.sh"]
    volumes:
      - ./bootstrap.sh:/bootstrap.sh
    networks:
      gr:
        ipv4_address: 172.28.1.6
    healthcheck:
      test: ["CMD-SHELL", "mysql -h172.28.1.2 -uroot -proot -N -e \"SELECT COUNT(*) FROM performance_schema.replication_group_members WHERE MEMBER_STATE='ONLINE'\" 2>/dev/null | grep -q 3"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 3s

  async-replica:
    image: mysql:8.4
    tmpfs:
      - /var/lib/mysql
    container_name: gr-async-replica
    depends_on:
      bootstrap:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - --innodb-buffer-pool-size=128M
      - --server-id=100
      - --log-bin=binlog
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --read-only=ON
      - --report-host=127.0.0.1
      - --report-port=3324
    volumes:
      - ./init-async-replica.sh:/docker-entrypoint-initdb.d/init-async-replica.sh
    ports:
      - "3324:3306"
    networks:
      gr:
        ipv4_address: 172.28.1.5
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -proot -e 'SHOW REPLICA STATUS\\G' 2>/dev/null | grep -q 'Replica_IO_Running: Yes'"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  write-load:
    image: mysql:8.4
    container_name: gr-write-load
    depends_on:
      bootstrap:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/write-load.sh"]
    volumes:
      - ./write-load.sh:/write-load.sh
    networks:
      gr:
        ipv4_address: 172.28.1.10
    restart: unless-stopped

networks:
  gr:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.1.0/24
