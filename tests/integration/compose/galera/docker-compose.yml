services:
  galera-node1:
    image: mariadb:11.4
    tmpfs:
      - /var/lib/mysql
    container_name: galera-node1
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: test
    command:
      - --innodb-buffer-pool-size=128M
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      - --wsrep-cluster-name=dolphie_test
      - --wsrep-cluster-address=gcomm://
      - --wsrep-node-address=172.28.0.2
      - --wsrep-node-name=node1
      - --binlog-format=ROW
      - --default-storage-engine=InnoDB
      - --innodb-autoinc-lock-mode=2
      - --gtid-strict-mode=ON
      - --server-id=1
      - --slave-parallel-threads=4
      - --log-bin
    ports:
      - "3307:3306"
    networks:
      galera:
        ipv4_address: 172.28.0.2
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -proot -e \"SHOW STATUS LIKE 'wsrep_ready'\" | grep -q ON"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  galera-node2:
    image: mariadb:11.4
    tmpfs:
      - /var/lib/mysql
    container_name: galera-node2
    depends_on:
      galera-node1:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: root
    command:
      - --innodb-buffer-pool-size=128M
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      - --wsrep-cluster-name=dolphie_test
      - --wsrep-cluster-address=gcomm://172.28.0.2
      - --wsrep-node-address=172.28.0.3
      - --wsrep-node-name=node2
      - --binlog-format=ROW
      - --default-storage-engine=InnoDB
      - --innodb-autoinc-lock-mode=2
      - --gtid-strict-mode=ON
      - --slave-parallel-threads=4
      - --log-bin
    ports:
      - "3308:3306"
    networks:
      galera:
        ipv4_address: 172.28.0.3

  galera-node3:
    image: mariadb:11.4
    tmpfs:
      - /var/lib/mysql
    container_name: galera-node3
    depends_on:
      galera-node1:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: root
    command:
      - --innodb-buffer-pool-size=128M
      - --wsrep-on=ON
      - --wsrep-provider=/usr/lib/galera/libgalera_smm.so
      - --wsrep-cluster-name=dolphie_test
      - --wsrep-cluster-address=gcomm://172.28.0.2
      - --wsrep-node-address=172.28.0.4
      - --wsrep-node-name=node3
      - --binlog-format=ROW
      - --default-storage-engine=InnoDB
      - --innodb-autoinc-lock-mode=2
      - --gtid-strict-mode=ON
      - --slave-parallel-threads=4
      - --log-bin
    ports:
      - "3309:3306"
    networks:
      galera:
        ipv4_address: 172.28.0.4

  write-load:
    image: mariadb:11.4
    container_name: write-load
    depends_on:
      galera-node1:
        condition: service_healthy
      galera-node2:
        condition: service_started
      galera-node3:
        condition: service_started
    entrypoint: ["/bin/bash", "/write-load.sh"]
    volumes:
      - ./write-load.sh:/write-load.sh
    networks:
      galera:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  async-replica:
    image: mariadb:11.4
    tmpfs:
      - /var/lib/mysql
    container_name: async-replica
    depends_on:
      galera-node1:
        condition: service_healthy
    environment:
      MARIADB_ROOT_PASSWORD: root
      MASTER_HOST: 172.28.0.2
    command:
      - --innodb-buffer-pool-size=128M
      - --server-id=100
      - --log-bin
      - --gtid-strict-mode=ON
      - --slave-parallel-threads=4
      - --read-only=ON
      - --report-host=127.0.0.1
      - --report-port=3310
    volumes:
      - ./init-replica.sh:/docker-entrypoint-initdb.d/init-replica.sh
    ports:
      - "3310:3306"
    networks:
      galera:
        ipv4_address: 172.28.0.5
    healthcheck:
      test: ["CMD-SHELL", "mariadb -uroot -proot -e 'SHOW SLAVE STATUS\\G' | grep -q 'Slave_IO_Running: Yes'"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

networks:
  galera:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.0.0/24
