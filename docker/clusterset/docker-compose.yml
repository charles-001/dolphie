services:
  cs-node1:
    image: mysql:8.4
    container_name: cs-node1
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
    command:
      - --server-id=1
      - --log-bin=binlog
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --plugin-load-add=group_replication.so
      - --loose-group-replication-start-on-boot=OFF
      - --report-host=172.28.2.2
      - --report-port=3306
      - --disabled-storage-engines=MyISAM,BLACKHOLE,FEDERATED,ARCHIVE,MEMORY
      - --log-replica-updates=ON
    ports:
      - "3311:3306"
    networks:
      clusterset:
        ipv4_address: 172.28.2.2
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -proot -e 'SELECT 1' 2>/dev/null"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  cs-node2:
