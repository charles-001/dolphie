      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s

  bootstrap:
    image: mysql:8.4
    container_name: cs-bootstrap
    depends_on:
      cs-node1:
        condition: service_healthy
      cs-node2:
        condition: service_healthy
      cs-node3:
        condition: service_healthy
      cs-node4:
        condition: service_healthy
      cs-node5:
        condition: service_healthy
      cs-node6:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c", "mysqlsh --no-defaults --js --file /bootstrap.js"]
    volumes:
      - ./bootstrap.js:/bootstrap.js
    networks:
      clusterset:
        ipv4_address: 172.28.2.10
    healthcheck:
      test: ["CMD-SHELL", "mysql -h172.28.2.2 -uroot -proot -N -e \"SELECT COUNT(*) FROM performance_schema.replication_group_members WHERE MEMBER_STATE='ONLINE'\" 2>/dev/null | grep -q 3"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 10s

  write-load:
    image: mysql:8.4
    container_name: cs-write-load
    depends_on:
      bootstrap:
        condition: service_healthy
    entrypoint: ["/bin/bash", "/write-load.sh"]
    volumes:
      - ./write-load.sh:/write-load.sh
    networks:
      clusterset:
        ipv4_address: 172.28.2.11
    restart: unless-stopped

networks:
  clusterset:
    driver: bridge
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.28.2.0/24
